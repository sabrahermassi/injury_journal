services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: injury-journal-ai-db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d injury-journal-ai-db"]
      interval: 10s
      timeout: 5s
      retries: 5

  embeddings:
    build:
      context: .
      dockerfile: src/embeddings/Dockerfile
    # PyTorch/uvicorn can leave zombie child processes that PID 1 won't reap
    # without an init process -- without this, `docker compose down`/restart
    # can hang trying to stop the container.
    init: true
    ports:
      - "8000:8000"
    environment:
      # Interpolated by Compose at parse time from the repo-root .env, which
      # the npm scripts pass via --env-file. Invoking `docker compose` here
      # directly, without that flag, will fail this check: Compose otherwise
      # looks for a .env beside this file, and there is none.
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:?Set EMBEDDING_API_KEY in the repo-root .env, and run via npm run dev:up}
    volumes:
      - hf-cache:/root/.cache/huggingface

volumes:
  postgres-data:
  hf-cache:
