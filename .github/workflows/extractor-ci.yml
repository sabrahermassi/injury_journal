name: Extractor Lambda CI

on:
  pull_request:
    branches: [main]
    paths:
      - "ai-injury-extractor/lambda/**"
      - "ai-injury-extractor/infrastructure/**"
      - ".github/workflows/extractor-ci.yml"
  push:
    branches: [main]
    paths:
      - "ai-injury-extractor/lambda/**"
      - "ai-injury-extractor/infrastructure/**"
      - ".github/workflows/extractor-ci.yml"

permissions:
  contents: read

jobs:
  lambda:
    name: Lambda (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-injury-extractor/lambda
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements-dev.txt

      - run: pytest
